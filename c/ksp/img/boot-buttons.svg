<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img"
     aria-label="The two buttons on the controller board: R is RESET, B is BOOT">
  <!-- board -->
  <rect x="0" y="0" width="300" height="190" rx="10" fill="#1d6b3f"/>
  <rect x="6" y="6" width="288" height="178" rx="7" fill="#20794a"/>

  <!-- SW3 = RESET, marked R on the silkscreen -->
  <text x="22" y="62" font-family="system-ui,sans-serif" font-size="13" fill="#eaf6ee">SW3</text>
  <rect x="70" y="28" width="66" height="60" rx="6" fill="#f2f2f2" stroke="#c9c9c9" stroke-width="2"/>
  <rect x="80" y="36" width="46" height="44" rx="4" fill="#fff" stroke="#d6d6d6"/>
  <circle cx="103" cy="58" r="15" fill="#efefef" stroke="#bdbdbd" stroke-width="2"/>
  <text x="152" y="66" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#ffffff">R</text>
  <text x="174" y="66" font-family="system-ui,sans-serif" font-size="15" fill="#bfe3cd">RESET</text>

  <!-- SW2 = BOOT, marked B on the silkscreen -->
  <text x="22" y="142" font-family="system-ui,sans-serif" font-size="13" fill="#eaf6ee">SW2</text>
  <rect x="70" y="108" width="66" height="60" rx="6" fill="#f2f2f2" stroke="#c9c9c9" stroke-width="2"/>
  <rect x="80" y="116" width="46" height="44" rx="4" fill="#fff" stroke="#d6d6d6"/>
  <circle cx="103" cy="138" r="15" fill="#efefef" stroke="#bdbdbd" stroke-width="2"/>
  <text x="152" y="146" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#ffffff">B</text>
  <text x="174" y="146" font-family="system-ui,sans-serif" font-size="15" fill="#bfe3cd">BOOT</text>
</svg>
